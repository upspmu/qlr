<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NIPUN Monthly Learning Report</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@500;700&family=Hind:wght@400;500;600;700&display=swap">
<style>
/* Layout: report sheet on a warm ground; level tabs, KPI band, grade-wise literacy|numeracy pair, focus list */
:root{
  --bg:#ffffff; --surface:#ffffff; --ink:#1d2433; --muted:#6c6f78; --rule:#e5e0d4;
  --navy:#1f2b4d; --navy-ink:#ffffff; --gold:#e8bf45; --gold-soft:#fbf3db;
  --num:#d9731b;
  --good:#2f7d3a; --good-bg:#e1f1de; --warn:#b8650f; --warn-bg:#fdf0d8; --bad:#b3261e; --bad-bg:#fbe2df;
  --chip-bg:#f3f1ec;
  color-scheme:light;
  --display:"Ubuntu","Segoe UI",system-ui,sans-serif;
  --body:"Hind","Nirmala UI","Mangal",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1280px;margin:0 auto;display:grid;gap:28px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}

/* masthead */
.mast{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.brand b{font-family:var(--display);font-size:17px;letter-spacing:.02em;color:var(--navy)}
.brand i{display:block;color:var(--muted);font-size:16px}
.where{text-align:right}
.where small{color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-size:12px}
.where h2{font-size:clamp(22px,3vw,30px);margin-top:2px}
.crumb{color:var(--muted);font-size:13px;margin-top:2px}
.title h1{font-size:clamp(32px,5.4vw,58px);line-height:1.05;color:var(--navy)}
.title p{margin:8px 0 0;color:var(--muted);font-style:italic}

/* tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:2px solid var(--rule);padding-bottom:0}
.tab{font:600 14px var(--body);background:none;border:0;color:var(--muted);padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;display:flex;gap:6px;align-items:center}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.tab:focus-visible,.gbtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.tab .dot{width:7px;height:7px;border-radius:50%;background:var(--good)}

/* KPI band */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.kpis.five{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:1050px){.kpis,.kpis.five{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.kpis,.kpis.five{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--rule);border-left:6px solid var(--gold);padding:14px 16px;display:grid;gap:4px;align-content:start;min-width:0}
.kpi .lab{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.kpi .val{font:700 clamp(24px,2.6vw,34px)/1.1 var(--display);font-variant-numeric:tabular-nums}
.kpi .val.na{color:var(--muted);font-size:24px}
.kpi .sub{font-size:13px;color:var(--muted)}
.kpi .split{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);border-top:1px dashed var(--rule);padding-top:6px;margin-top:4px}
.kpi.sak .val{color:var(--good)} .kpi.mad .val{color:var(--warn)} .kpi.pra .val{color:var(--num)} .kpi.zero .val{color:var(--bad)}

.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:820px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--gold-soft);padding:12px 16px;display:grid;gap:2px;min-width:0}
.stat .lab{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.stat .val{font:700 26px/1.15 var(--display);font-variant-numeric:tabular-nums}
.stat .val small{font-size:16px;color:var(--muted);font-weight:500}
.note{font-size:13px;color:var(--muted);background:var(--surface);border:1px dashed var(--rule);padding:10px 14px}

/* section heads */
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.sh h2{font-size:22px}
.sh .aside{font-size:13px;color:var(--muted);font-style:italic}
.gnav{display:flex;gap:6px;flex-wrap:wrap}
.gbtn{font:600 13px var(--body);border:1px solid var(--rule);background:var(--surface);color:var(--ink);padding:5px 12px;cursor:pointer}
.gbtn[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}

.grade{display:grid;gap:12px}
.ghead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ghead h3{font-size:19px;color:var(--ink)}
.ghead .pill{font-size:13px;background:var(--chip-bg);padding:3px 10px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:980px){.pair{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--rule);border-left:6px solid var(--gold);padding:14px 16px 16px;min-width:0;display:grid;gap:10px;align-content:start}
.panel h4{margin:0;font:700 19px var(--display);color:var(--navy);letter-spacing:.02em}
.panel.n h4{color:var(--num)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{background:var(--navy);color:var(--navy-ink);font:600 11.5px var(--body);text-transform:uppercase;letter-spacing:.04em;padding:8px 8px;text-align:left;white-space:nowrap}
th.c,td.c{text-align:center}
th.p{background:var(--good);color:#fff} th.k{background:var(--bad);color:#fff}
td{padding:7px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
td.code{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
td.txt{min-width:220px;line-height:1.4}
td.c{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;width:1%}
.g{background:var(--good-bg);color:var(--good)} .w{background:var(--warn-bg);color:var(--warn)} .b{background:var(--bad-bg);color:var(--bad)}
.d{font-weight:500;font-size:13px}
.d.up{color:var(--good)} .d.dn{color:var(--bad)} .d.eq{color:var(--muted)}

.legend{font-size:12.5px;color:var(--muted);display:grid;gap:3px}
.legend b{color:var(--ink)}

/* focus */
.focus{background:var(--gold-soft);border-left:6px solid var(--gold);padding:12px 16px 16px;min-width:0}
.focus td{border-bottom-color:var(--rule)}
.focus th{background:transparent;color:var(--muted);border-bottom:2px solid var(--rule)}
.rank{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--gold);color:#1d2433;font-weight:700;font-family:var(--display)}
.chip{display:inline-block;border:1.5px solid var(--navy);padding:1px 7px;font-size:12px;font-weight:700;color:var(--navy);white-space:nowrap}
.chip.num{border-color:var(--num);color:var(--num)}
.big{font:700 18px var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.big.bad{color:var(--bad)} .big.warn{color:var(--warn)} .big.good{color:var(--good)}

.empty{background:var(--surface);border:1px dashed var(--muted);padding:28px 24px;display:grid;gap:8px;max-width:720px}
.empty h3{font-size:20px}
.empty p{margin:0;color:var(--muted)}
.pdfbar{margin-left:auto;display:flex;gap:6px;align-items:center;padding-bottom:6px}
.pdfbtn{font:600 13px var(--body);border:1.5px solid var(--navy);background:var(--navy);color:var(--navy-ink);padding:6px 12px;cursor:pointer}
.pdfbtn.alt{background:var(--surface);color:var(--navy)}
.pdfbtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.lvlhead{display:none}
@media print{
  @page{size:A4 landscape;margin:9mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{padding:0;font-size:12.5px}
  .wrap{max-width:none;gap:16px}
  .tabs,.gnav,.pdfbar{display:none!important}
  .kpis,.kpis.five{grid-template-columns:repeat(6,minmax(0,1fr))}
  .kpis.five{grid-template-columns:repeat(5,minmax(0,1fr))}
  .strip{grid-template-columns:repeat(4,minmax(0,1fr))}
  .pair{grid-template-columns:1fr 1fr}
  .tbl{overflow:visible}
  #view,#view>section,body.all .lvl{display:block!important}
  #view>section,#view>.note,body.all .lvl>section,body.all .lvlhead{margin-bottom:14px}
  .kpis,.strip{display:grid!important}
  .grade{break-inside:avoid;page-break-inside:avoid;margin-bottom:14px;display:block}
  .ghead{margin-bottom:8px}
  #view section:has(.focus),.focus{break-inside:avoid;page-break-inside:avoid}
  .kpi,.stat,tr{break-inside:avoid}
  .sh{break-after:avoid}
  .title h1{font-size:34px}
  body.all .where{display:none}
  body.all .lvl{break-before:page;display:grid;gap:16px}
  body.all .lvl:first-child{break-before:auto}
  body.all .lvlhead{display:block;border-bottom:3px solid var(--gold);padding-bottom:6px}
  body.all .lvlhead h2{font-size:24px}
  body.all .lvlhead span{color:var(--muted);font-size:13px}
}
.wsbtn{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--navy);padding:4px 10px 4px 4px;cursor:pointer;font:600 13px var(--body);color:var(--navy);text-align:left}
.wsbtn:hover{background:var(--chip-bg)}
.wsbtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wsbtn img{width:44px;height:52px;object-fit:cover;object-position:top;border:1px solid var(--rule);display:block}
.wsbtn small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.wsmodal{position:fixed;inset:0;background:rgba(20,24,33,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.wsbox{background:var(--surface);width:min(860px,100%);display:grid;gap:0;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.wsbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;background:var(--navy);color:var(--navy-ink);position:sticky;top:0}
.wsbar h3{font-size:17px;margin-right:auto;min-width:0}
.wsbar button{font:600 13px var(--body);padding:7px 12px;cursor:pointer;border:1.5px solid var(--gold)}
.wsdl{background:var(--gold);color:#1d2433}
.wsx{background:transparent;color:var(--navy-ink)}
.wsmsg{font-size:12.5px;color:var(--navy-ink);opacity:.85;width:100%}
.wsbox img{width:100%;height:auto;display:block}
@media print{.wsmodal{display:none!important}.wsbtn img{display:none}}
footer{font-size:12.5px;color:var(--muted);border-top:1px solid var(--rule);padding-top:12px}
</style>
</head>
<body>


<div class="wrap">
  <header class="mast">
    <div class="brand"><b>NIPUN BHARAT</b><i>बेसिक शिक्षा विभाग, उत्तर प्रदेश</i></div>
    <div class="where">
      <small id="meta"></small>
      <h2 id="placeName"></h2>
      <div class="crumb" id="crumb"></div>
    </div>
  </header>

  <section class="title">
    <h1>Monthly Learning Report</h1>
    <p id="subline"></p>
  </section>

  <nav class="tabs" role="tablist" id="tabs"></nav>

  <main id="view" style="display:grid;gap:28px"></main>

  <footer id="foot"></footer>
</div>
<div class="wsmodal" id="wsmodal" hidden role="dialog" aria-modal="true" aria-labelledby="wsTitle">
  <div class="wsbox">
    <div class="wsbar"><h3 id="wsTitle">Worksheet</h3>
      <button class="wsdl" id="wsDl" type="button">Download worksheet</button>
      <button class="wsx" id="wsX" type="button">Close</button>
      <div class="wsmsg" id="wsMsg" aria-live="polite"></div></div>
    <img id="wsImg" src="" alt="">
  </div>
</div>

<script>
const DATA = {"comps": [{"code": "H104.2", "grade": 1, "subj": "LIT", "text": "चित्र/घटना/वस्तु के बारे में अपने घर की भाषा में 2–3 वाक्यों में बताना।"}, {"code": "H106.2", "grade": 1, "subj": "LIT", "text": "बच्चा आयु-उपयुक्त अज्ञात पाठ से 4–5 सरल शब्दों वाले छोटे-छोटे वाक्य पढ़ लेता है।"}, {"code": "H108.1", "grade": 1, "subj": "LIT", "text": "बच्चा अब तक सिखाए गए वर्ण/अक्षर पहचान लेता है और उन्हें सुनकर लिख लेता है।"}, {"code": "M102.3-1", "grade": 1, "subj": "NUM", "text": "20 तक की संख्याओं (ठोस वस्तुओं और चित्रों से साथ )की गिनती को समझना।"}, {"code": "M102.3", "grade": 1, "subj": "NUM", "text": "1 से 20 तक की संख्याओं (चित्रों और प्रतीकों के साथ ) की तुलना को बड़ा और छोटा शब्दों का उपयोग के साथ समझना ।"}, {"code": "M103.1-1", "grade": 1, "subj": "NUM", "text": "1 से 9 तक की संख्याओं (ठोस वस्तुओं और चित्रों के साथ) को मिलाकर जोड़ को समझना ।"}, {"code": "M103.1", "grade": 1, "subj": "NUM", "text": "बच्चा दैनिक जीवन में 1 से 9 तक की संख्याओं का जोड़ कर लेता है। (योग 20 से अधिक न हो)"}, {"code": "M103.2-1", "grade": 1, "subj": "NUM", "text": "1 से 9 तक की संख्याओं (ठोस वस्तुओं और चित्रों के साथ) के घटाव को समझना ।"}, {"code": "M103.2", "grade": 1, "subj": "NUM", "text": "बच्चा दैनिक जीवन में 1 से 9 तक की संख्याओं का घटाव कर लेता है।"}, {"code": "H202.2", "grade": 2, "subj": "LIT", "text": "बच्चा कहानियों/कविताओं/चित्र/घटना/वस्तु एवं उपलब्ध प्रिंट सामग्री के बारे में अपने घर की भाषा में बातचीत एवं चर्चा कर लेता है।"}, {"code": "H208", "grade": 2, "subj": "LIT", "text": "बच्चा अज्ञात पाठ (45–60 शब्द वाले) पढ़ लेता है और उससे से संबंधित 5 प्रश्नों (3 तथ्यात्मक और 2 उच्चस्तरीय चिंतन कौशल) में से कम से कम 4 के उत्तर अपनी भाषा में दे लेता है।"}, {"code": "H211", "grade": 2, "subj": "LIT", "text": "बच्चा किसी कहानी, चित्र, घटना आदि पर अपने अनुभव या विचार 1–2 वाक्यों में व्याकरण की दृष्टि से सही लिख लेता है"}, {"code": "M202.1", "grade": 2, "subj": "NUM", "text": "99 तक की संख्याओं (चित्र और प्रतीक के साथ ) के जोड़ को समझना"}, {"code": "M202.1-1", "grade": 2, "subj": "NUM", "text": "99 तक की संख्याओं के जोड़ को शाब्दिक प्रश्न के माध्यम से समझना"}, {"code": "M202.2", "grade": 2, "subj": "NUM", "text": "99 तक की संख्याओं (चित्र और प्रतीक के साथ ) के घटाव को समझना"}, {"code": "H304-1", "grade": 3, "subj": "LIT", "text": "बच्चा कविता/कहानी से जुड़े 4–5 तथ्यात्मक एवं 2–3 उच्चस्तरीय चिंतन कौशल के प्रश्नों के उत्तर स्थानीय भाषा में दे लेता है।"}, {"code": "H308", "grade": 3, "subj": "LIT", "text": "बच्चा आयु उपयुक्त अज्ञात पाठ/8–12 वाक्यों के अनुच्छेद को पढ़कर 4 में से कम से कम 3 प्रश्नों (तथ्यान्तक एवं उच्चस्तरीय चिंतन कौशल) का उत्तर स्थानीय भाषा में दे लेता है।"}, {"code": "H309", "grade": 3, "subj": "LIT", "text": "बच्चा विभिन्न उद्देश्यों जैसे—किसी चित्र, कहानी या घटना पर अपने अनुभव/विचार साझा करने के लिए 1–2 वाक्यों में लघु संदेश लिख लेता है।"}, {"code": "M301-1", "grade": 3, "subj": "NUM", "text": "बच्चा 1–999 तक की संख्याओं की मात्रा और प्रतीकों को समझ और लिख लेता है।"}, {"code": "M301-3", "grade": 3, "subj": "NUM", "text": "बच्चा 10–999 तक की संख्याओं को विस्तारित रूप में लिख लेता है।"}, {"code": "M301.4", "grade": 3, "subj": "NUM", "text": "बच्चा 1–999 तक की संख्याओं की तुलना कर लेता है।"}, {"code": "M302-2", "grade": 3, "subj": "NUM", "text": "बच्चा दैनिक जीवन में तीन अंकों की संख्याओं का जोड़ व घटाव कर लेता है।"}, {"code": "M303-1", "grade": 3, "subj": "NUM", "text": "बच्चा 2 से 10 तक की संख्या के गुणन तथ्यों (तालिकाओं) का निर्माण एवं उपयोग कर लेता है तथा विभाजन तथ्यों का उपयोग कर लेता है।"}, {"code": "M308-1", "grade": 3, "subj": "NUM", "text": "बच्चा संख्याओं, घटनाओं और आकृतियों पर सरल पैटर्न के लिए नियमों की पहचान कर लेता है, विस्तार कर लेता है और संप्रेषण कर लेता है।"}], "lo": {"state": {"H104.2": [95.0, 4.0], "H106.2": [26.0, 73.0], "H108.1": [59.0, 40.0], "H202.2": [93.0, 6.0], "H208": [61.0, 38.0], "H211": [77.0, 22.0], "H304-1": [75.0, 24.0], "H308": [65.0, 34.0], "H309": [58.0, 41.0], "M102.3-1": [68.0, 31.0], "M102.3": [66.0, 33.0], "M103.1-1": [91.0, 8.0], "M103.1": [85.0, 14.0], "M103.2-1": [83.0, 16.0], "M103.2": [77.0 function kpiCard(cls, label, v, sub){

  return `<div class="kpi ${cls}"><span class="lab">${label}</span>

}

  const d = Math.round((r.prof - p[0])*10)/10;
  const cls = d>0.05 ? "up" : d<-0.05 ? "dn" : "eq";
  return `<td class="c d ${cls}">${d>0?"+":""}${d.toString().replace(/\.0$/,"")}</td>`;
}

function panel(list, subj, parentKey, parentName){
  const isN = subj==="NUM";
  const body = list.map(r=>`<tr>
      <td class="code">${esc(r.code)}</td>
      <td class="txt">${esc(r.text)}</td>
      <td class="c ${profCls(r.prof)}">${pct(r.prof)}</td>
      <td class="c ${critCls(r.crit)}">${pct(r.crit)}</td>
      ${deltaCell(r,parentKey)}</tr>`).join("");
  return `<div class="panel ${isN?'n':''}">
    <h4>${isN?"NUMERACY · गणित":"LITERACY · भाषा"}</h4>
    <div class="tbl"><table>
      <thead><tr><th>LO Code</th><th>दक्षता (Competency)</th><th class="c p">Proficient</th><th class="c k">Critical</th>${parentKey?`<th class="c">Δ vs ${esc(parentName)}</th>`:""}</tr></thead>
      <tbody>${body}</tbody></table></div></div>`;
}

let gradeFilter = "all";

function render(key){
  const L = byKey[key] || byKey.state;
  current = L.key;
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected", t.dataset.k===L.key));
  document.getElementById("meta").textContent = `${CFG.milestone} · ${CFG.month} · Grades 1–3`;
  document.getElementById("placeName").textContent = placeLabel(L);
  document.getElementById("crumb").textContent = L.crumb.join(" › ");
  const view = document.getElementById("view");

  const all = rows(L.key);
  const parent = L.parent;
  const parentName = parent ? byKey[parent].tab : "";
  const lit = all.filter(r=>r.subj==="LIT"), num = all.filter(r=>r.subj==="NUM");
  const below = all.filter(r=>r.prof<TARGET);
  const h = DATA.head[L.key] || {};
  document.getElementById("subline").textContent = `${CFG.month} · Competency assessment against ${CFG.milestone} learning outcomes · ${all.length} competencies across Grades 1–3`;


  let html = `<section class="kpis${L.key==="school"?" five":""}">
      ${L.key==="school"?"":kpiCard("","Schools assessed",h.schools,"Grade 1–5 schools")}
      ${kpiCard("","Students assessed",h.students,"Grade 1–3 enrolled")}
      ${kpiCard("sak","Saksham students",h.saksham,"Grade 1–3 students")}
      ${kpiCard("mad","Madhyam students",h.madhyam,"Grade 1–3 students")}
      ${kpiCard("pra","Pragatisheel students",h.pragati,"Grade 1–3 students")}
      ${kpiCard("zero","Zero scorers",h.zero,"no item correct")}
    </section>
    <section class="strip">
      <div class="stat"><span class="lab">Avg proficient</span><span class="val num">${pct(avg(all.map(r=>r.prof)))}</span></div>
      <div class="stat"><span class="lab">Below 75% proficient</span><span class="val num">${below.length}<small>/${all.length}</small></span></div>
      <div class="stat"><span class="lab">Literacy avg proficient</span><span class="val num">${pct(avg(lit.map(r=>r.prof)))}</span></div>
      <div class="stat"><span class="lab">Numeracy avg proficient</span><span class="val num">${pct(avg(num.map(r=>r.prof)))}</span></div>
    </section>

    <section style="display:grid;gap:18px">
      <div class="sh"><h2>Competency performance by grade</h2>
        <div class="gnav" role="group" aria-label="Filter grade">
          ${["all",1,2,3].map(g=>`<button class="gbtn" data-g="${g}" aria-pressed="${String(gradeFilter)===String(g)}">${g==="all"?"All grades":"Grade "+g}</button>`).join("")}
        </div></div>`;

  [1,2,3].filter(g=>gradeFilter==="all"||String(gradeFilter)===String(g)).forEach(g=>{
    const gl = lit.filter(r=>r.grade===g), gn = num.filter(r=>r.grade===g);
    html += `<div class="grade"><div class="ghead"><h3>Grade ${g} · कक्षा ${g}</h3>
        <span class="pill num">Literacy ${pct(avg(gl.map(r=>r.prof)))}</span>
        <span class="pill num">Numeracy ${pct(avg(gn.map(r=>r.prof)))}</span></div>
      <div class="pair">${panel(gl,"LIT",parent,parentName)}${panel(gn,"NUM",parent,parentName)}</div></div>`;
  });

  html += `<div class="legend">
      <div><b>Proficient</b> = % of students who answered all questions of the competency correctly. <b>Critical</b> = % of students who answered none correctly.</div>
      <div><b>Proficient %:</b> ≥75% on track · 50–74% improving · &lt;50% critical &nbsp;|&nbsp; <b>Critical %:</b> ≥20% high · 10–19% watch · &lt;10% healthy${parent?` &nbsp;|&nbsp; <b>Δ</b> = proficient % points vs ${esc(parentName)}`:""}</div>
    </div></section>`;

  const pick = (g,subj)=>all.filter(r=>r.grade===g && r.subj===subj && r.prof<TARGET).sort((a,b)=>b.crit-a.crit || a.prof-b.prof)[0];
  const focus = [];
  [1,2,3].forEach(g=>["LIT","NUM"].forEach(s=>focus.push({g,s,r:pick(g,s)})));
  let rank = 0;
  html += `<section style="display:grid;gap:12px">
      <div class="sh"><h2>Focus competencies</h2><span class="aside">Per grade: the most critical literacy and numeracy competency below 75% proficient</span></div>
      <div class="focus"><div class="tbl"><table>
        <thead><tr><th>Grade</th><th>Subject</th><th>LO Code</th><th>दक्षता (Competency)</th><th class="c">Proficient</th><th class="c">Critical</th><th>TG Reference</th><th>Worksheet</th></tr></thead>
        <tbody>${focus.map(({g,s,r})=>{
          const chip = `<span class="chip ${s==="NUM"?"num":""}">${s}</span>`;
          if(!r) return `<tr><td class="num" style="white-space:nowrap">Grade ${g}</td><td>${chip}</td><td colspan="6" style="color:var(--muted)">All ${s==="LIT"?"literacy":"numeracy"} competencies are at or above 75% proficient.</td></tr>`;
          const ref = DATA.tg[r.code] || {};
          return `<tr>
          <td class="num" style="white-space:nowrap"><b>Grade ${g}</b></td>
          <td>${chip}</td>
          <td class="code">${esc(r.code)}</td>
          <td class="txt">${esc(r.text)}</td>
          <td class="c"><span class="big ${r.prof>=50?"warn":"bad"}">${pct(r.prof)}</span></td>
          <td class="c"><span class="big ${r.crit>=20?"bad":r.crit>=10?"warn":"good"}">${pct(r.crit)}</span></td>
          <td style="white-space:nowrap">${esc(ref.tg||"—")}</td>
          <td>${WS_IMG[r.code]?`<button class="wsbtn" type="button" data-ws="${esc(r.code)}" aria-label="Open worksheet ${esc(r.code)}"><img src="${WS_IMG[r.code]}" alt=""><span>Worksheet ${esc(r.code)}<small>View &amp; download</small></span></button>`:"—"}</td></tr>`;}).join("")}</tbody>
      </table></div></div></section>`;

  view.innerHTML = html;
  view.querySelectorAll(".wsbtn").forEach(b=>b.addEventListener("click",()=>openWS(b.dataset.ws, b)));
  view.querySelectorAll(".gbtn").forEach(b=>b.addEventListener("click",()=>{gradeFilter=b.dataset.g==="all"?"all":Number(b.dataset.g); render(L.key);}));
}

const STANDALONE = true;
document.getElementById("tabs").innerHTML = CFG.levels.map(l=>`<button class="tab" role="tab" id="tab-${l.key}" data-k="${l.key}"><span class="dot"></span>${l.tab}</button>`).join("")
  + (STANDALONE ? `<span class="pdfbar"><button class="pdfbtn" id="pdfOne" type="button">Download PDF</button><button class="pdfbtn alt" id="pdfAll" type="button">PDF · all levels</button></span>` : "");
let current = "state";
function placeLabel(L){ return (L.kind==="State"||L.kind==="School") ? L.name : `${L.name} ${L.kind}`; }
if(STANDALONE){
  document.getElementById("pdfOne").addEventListener("click",()=>window.print());
  document.getElementById("pdfAll").addEventListener("click",()=>{
    const keep = current, parts = [];
    CFG.levels.forEach(L=>{ render(L.key);
      parts.push(`<div class="lvl"><div class="lvlhead"><h2>${esc(placeLabel(L))}</h2><span>${esc([CFG.milestone,CFG.month,L.crumb.join(" › ")].filter(Boolean).join(" · "))}</span></div>${document.getElementById("view").innerHTML}</div>`); });
    document.getElementById("view").innerHTML = parts.join("");
    document.body.classList.add("all");
    const restore = ()=>{ document.body.classList.remove("all"); render(keep); window.removeEventListener("afterprint",restore); };
    window.addEventListener("afterprint",restore);
    window.print();
  });
}
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{ location.hash = t.dataset.k; render(t.dataset.k); }));
document.getElementById("foot").textContent = `Source: Competency Mapping workbook. LO codes and competency text from MS Q3; State, Azamgarh District and Mirzapur Block results from their LO sheets. Headline counts (except State schools and students), Division and School results, and TG references are dummy placeholders. Worksheets are draft practice sheets for each MS Q3 LO. ${CFG.month}.`;
window.addEventListener("hashchange",()=>render(location.hash.slice(1)));
const modal = document.getElementById("wsmodal");
let wsCode = null, wsReturn = null;
function wsFile(code){ return `Worksheet_${code.replace(/[^A-Za-z0-9.-]/g,"_")}_MS_Q3.png`; }
function openWS(code, from){
  wsCode = code; wsReturn = from;
  const c = DATA.comps.find(x=>x.code===code);
  document.getElementById("wsTitle").textContent = `Worksheet ${code} · Grade ${c?c.grade:""}`;
  document.getElementById("wsImg").src = WS_IMG[code];
  document.getElementById("wsImg").alt = `Worksheet for ${code}`;
  document.getElementById("wsMsg").textContent = "";
  modal.hidden = false; document.getElementById("wsDl").focus();
}
function closeWS(){ modal.hidden = true; if(wsReturn) wsReturn.focus(); }
document.getElementById("wsX").addEventListener("click", closeWS);
modal.addEventListener("click", e=>{ if(e.target===modal) closeWS(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && !modal.hidden) closeWS(); });
document.getElementById("wsDl").addEventListener("click", async ()=>{
  const msg = document.getElementById("wsMsg");
  const name = wsFile(wsCode), url = WS_IMG[wsCode];
  if(STANDALONE){
    const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    return;
  }
  try{
    const dl = window.claude ? await window.claude.use("downloads") : null;
    if(!dl){ msg.textContent = "Download isn't available in this view. Long-press or right-click the worksheet to save the image."; return; }
    const blob = await (await fetch(url)).blob();
    await dl.save({filename:name, data:blob});
    msg.textContent = "Saved " + name;
  }catch(err){
    const code = err && err.code;
    msg.textContent = code==="declined" ? "Download cancelled." : code==="rate_limited" ? "A download prompt is already open." : "Download isn't available here. Right-click or long-press the worksheet to save it.";
  }
});
render(location.hash.slice(1) || "state");
</script>

</body>
</html>
